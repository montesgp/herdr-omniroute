id = "herdr.omniroute"
name = "OmniRoute Gateway"
version = "0.2.0"
description = "Status, start and dashboard for the OmniRoute auto-fallback gateway (localhost:20128)"
author = "montesgp"
platforms = ["windows"]
min_herdr_version = "0.7.0"

[[actions]]
id = "status"
title = "OmniRoute: status"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/status.ps1"]

[[actions]]
id = "start"
title = "OmniRoute: start gateway"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/start.ps1"]

[[actions]]
id = "dashboard"
title = "OmniRoute: open dashboard"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/dashboard.ps1"]

[[actions]]
id = "open-status-pane"
title = "OmniRoute: open status pane"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-status-pane.ps1"]

[[panes]]
id = "status"
title = "OmniRoute Gateway"
placement = "tab"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/status-dashboard.ps1"]

[[startup]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-status-pane.ps1"]
